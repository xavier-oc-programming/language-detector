<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --violet: #7C3AED;
      --violet-light: #A78BFA;
      --violet-pale: #EDE9FE;
      --violet-dark: #5B21B6;
      --bg: #F9FAFB;
      --surface: #FFFFFF;
      --border: #E5E7EB;
      --text: #111827;
      --muted: #6B7280;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 0;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--violet);
      letter-spacing: -0.5px;
    }

    header p.subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 1rem;
    }

    header p.meta {
      color: var(--violet-light);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    label.section-label {
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
      color: var(--text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--violet);
    }

    .char-counter {
      text-align: right;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .char-counter.warn { color: #F59E0B; }
    .char-counter.error { color: #EF4444; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .example-btn {
      background: var(--violet-pale);
      color: var(--violet-dark);
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, transform 0.1s;
    }

    .example-btn:hover {
      background: var(--violet-light);
      color: white;
      transform: translateY(-1px);
    }

    .detect-btn {
      background: var(--violet);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
    }

    .detect-btn:hover:not(:disabled) {
      background: var(--violet-dark);
      transform: translateY(-1px);
    }

    .detect-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Results */
    #results { display: none; }

    .hero-result {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
    }

    .hero-flag {
      font-size: 3.5rem;
      line-height: 1;
    }

    .hero-info h2 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .hero-info .confidence-text {
      color: var(--violet);
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .script-badge {
      display: inline-block;
      background: var(--violet-pale);
      color: var(--violet-dark);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 6px;
    }

    .explanation-text {
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .ngrams-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .ngrams-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
    }

    .ngram-pill {
      background: var(--violet);
      color: white;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.9rem;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }

    .top-3-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .top-3-grid { grid-template-columns: 1fr; }
    }

    .lang-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: border-color 0.2s;
    }

    .lang-card.primary {
      border-color: var(--violet);
      background: #FAFAFF;
    }

    .lang-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .lang-flag { font-size: 1.6rem; }
    .lang-name { font-weight: 600; font-size: 1rem; }
    .lang-pct { font-weight: 700; color: var(--violet); font-size: 1rem; }

    .conf-bar-bg {
      background: var(--border);
      border-radius: 4px;
      height: 7px;
      overflow: hidden;
    }

    .conf-bar-fill {
      height: 100%;
      background: var(--violet);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .lang-card:not(.primary) .conf-bar-fill {
      background: var(--violet-light);
    }

    .spinner {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    .spinner.active { display: block; }

    .error-msg {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 12px 16px;
      display: none;
      margin-top: 12px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>🌍 Language Detector</h1>
  <p class="subtitle">Paste any text — the model identifies the language and explains why</p>
  <p class="meta" id="meta-accuracy">17 languages · character n-gram patterns</p>
</header>

<div class="container">

  <!-- Input card -->
  <div class="card">
    <label class="section-label">Input text</label>
    <textarea id="input-text" placeholder="Paste text in any language here..."></textarea>
    <div class="char-counter" id="char-counter">0 / 5000</div>

    <div class="examples">
      <span style="font-size:0.85rem;color:var(--muted);align-self:center;">Try:</span>
      <button class="example-btn" data-lang="English">🇬🇧 English</button>
      <button class="example-btn" data-lang="Spanish">🇪🇸 Spanish</button>
      <button class="example-btn" data-lang="French">🇫🇷 French</button>
      <button class="example-btn" data-lang="German">🇩🇪 German</button>
      <button class="example-btn" data-lang="Arabic">🇸🇦 Arabic</button>
      <button class="example-btn" data-lang="Russian">🇷🇺 Russian</button>
    </div>

    <button class="detect-btn" id="detect-btn">Detect Language</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Loading -->
  <div class="spinner" id="spinner">Detecting...</div>

  <!-- Results -->
  <div id="results">

    <!-- Hero result -->
    <div class="card">
      <div class="hero-result">
        <div class="hero-flag" id="hero-flag"></div>
        <div class="hero-info">
          <h2 id="hero-language"></h2>
          <div class="confidence-text" id="hero-confidence"></div>
          <div class="script-badge" id="script-badge"></div>
        </div>
      </div>
      <hr class="divider" style="margin-bottom:16px">
      <p class="explanation-text" id="explanation-text"></p>
      <div class="ngrams-row" id="ngrams-row"></div>
    </div>

    <!-- Top 3 -->
    <div class="card">
      <label class="section-label">Top 3 languages</label>
      <div class="top-3-grid" id="top-3-grid"></div>
    </div>

  </div>
</div>

<script>
  const EXAMPLES = {
    English: "The development of artificial intelligence has transformed how we interact with technology. Machine learning models can now recognise speech, translate languages, and generate coherent text. These advances raise important questions about the future of human work and creativity.",
    Spanish: "El desarrollo de la inteligencia artificial ha transformado la manera en que interactuamos con la tecnología. Los modelos de aprendizaje automático ahora pueden reconocer el habla, traducir idiomas y generar texto coherente. Estos avances plantean preguntas importantes sobre el futuro del trabajo y la creatividad humana.",
    French: "Le développement de l'intelligence artificielle a transformé la façon dont nous interagissons avec la technologie. Les modèles d'apprentissage automatique peuvent désormais reconnaître la parole, traduire des langues et générer des textes cohérents. Ces avancées soulèvent des questions importantes sur l'avenir du travail et de la créativité humaine.",
    German: "Die Entwicklung der künstlichen Intelligenz hat die Art und Weise verändert, wie wir mit Technologie interagieren. Maschinelle Lernmodelle können jetzt Sprache erkennen, Sprachen übersetzen und kohärente Texte generieren. Diese Fortschritte werfen wichtige Fragen über die Zukunft der menschlichen Arbeit und Kreativität auf.",
    Arabic: "أدى تطور الذكاء الاصطناعي إلى تحويل طريقة تفاعلنا مع التكنولوجيا. تستطيع نماذج التعلم الآلي الآن التعرف على الكلام وترجمة اللغات وتوليد نصوص متماسكة. وتثير هذه التطورات تساؤلات مهمة حول مستقبل العمل البشري والإبداع.",
    Russian: "Развитие искусственного интеллекта изменило способ взаимодействия человека с технологиями. Модели машинного обучения теперь способны распознавать речь, переводить языки и генерировать связные тексты. Эти достижения поднимают важные вопросы о будущем человеческого труда и творчества.",
  };

  const textarea = document.getElementById('input-text');
  const counter = document.getElementById('char-counter');
  const detectBtn = document.getElementById('detect-btn');
  const errorMsg = document.getElementById('error-msg');
  const spinner = document.getElementById('spinner');
  const results = document.getElementById('results');

  // Load accuracy from API
  fetch('/api/model-info')
    .then(r => r.json())
    .then(d => {
      const acc = d.accuracy ? (d.accuracy * 100).toFixed(1) : null;
      const f1 = d.macro_f1 ? (d.macro_f1 * 100).toFixed(1) : null;
      const model = d.model_name || '';
      if (acc) {
        document.getElementById('meta-accuracy').textContent =
          `17 languages · character n-gram patterns · ${acc}% accuracy · ${model}`;
      }
    })
    .catch(() => {});

  // Character counter
  textarea.addEventListener('input', () => {
    const len = textarea.value.length;
    counter.textContent = `${len} / 5000`;
    counter.className = 'char-counter' + (len > 4500 ? ' warn' : '') + (len > 5000 ? ' error' : '');
    if (debounceTimer) clearTimeout(debounceTimer);
    if (len >= 20) {
      debounceTimer = setTimeout(() => runDetection(), 500);
    }
  });

  // Example buttons
  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      textarea.value = EXAMPLES[lang] || '';
      textarea.dispatchEvent(new Event('input'));
    });
  });

  detectBtn.addEventListener('click', runDetection);

  let debounceTimer = null;

  async function runDetection() {
    const text = textarea.value.trim();
    if (text.length < 10) {
      showError('Please enter at least 10 characters.');
      return;
    }
    if (text.length > 5000) {
      showError('Text must be 5000 characters or fewer.');
      return;
    }

    hideError();
    setLoading(true);

    try {
      const resp = await fetch('/detect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      if (resp.status === 503) {
        showError('Model not loaded. Please run train.py first.');
        return;
      }
      if (!resp.ok) {
        const err = await resp.json();
        showError(err.detail || 'Detection failed.');
        return;
      }

      const data = await resp.json();
      renderResults(data);
    } catch (e) {
      showError('Network error. Is the server running?');
    } finally {
      setLoading(false);
    }
  }

  function renderResults(data) {
    const top = data.top_languages[0];

    document.getElementById('hero-flag').textContent = top.flag_emoji;
    document.getElementById('hero-language').textContent = top.language;
    document.getElementById('hero-confidence').textContent = `${top.confidence_pct}% confident`;
    document.getElementById('script-badge').textContent = `Script: ${data.script_type}`;
    document.getElementById('explanation-text').textContent = data.explanation;

    // N-gram pills
    const ngRow = document.getElementById('ngrams-row');
    ngRow.innerHTML = '';
    if (data.top_ngrams && data.top_ngrams.length > 0) {
      const lbl = document.createElement('span');
      lbl.className = 'ngrams-label';
      lbl.textContent = 'Key patterns:';
      ngRow.appendChild(lbl);
      data.top_ngrams.forEach(g => {
        const pill = document.createElement('span');
        pill.className = 'ngram-pill';
        pill.textContent = g.ngram;
        pill.title = g.interpretation;
        ngRow.appendChild(pill);
      });
    }

    // Top 3 cards
    const grid = document.getElementById('top-3-grid');
    grid.innerHTML = '';
    data.top_languages.forEach((lang, i) => {
      const card = document.createElement('div');
      card.className = 'lang-card' + (i === 0 ? ' primary' : '');
      card.innerHTML = `
        <div class="lang-card-header">
          <span class="lang-flag">${lang.flag_emoji}</span>
          <span class="lang-name">${lang.language}</span>
          <span class="lang-pct" style="margin-left:auto">${lang.confidence_pct}%</span>
        </div>
        <div class="conf-bar-bg">
          <div class="conf-bar-fill" style="width:${lang.confidence_pct}%"></div>
        </div>
      `;
      grid.appendChild(card);
    });

    results.style.display = 'block';
  }

  function setLoading(on) {
    detectBtn.disabled = on;
    spinner.className = 'spinner' + (on ? ' active' : '');
    if (on) results.style.display = 'none';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }
</script>
</body>
</html>
